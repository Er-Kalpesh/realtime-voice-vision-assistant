<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Realtime Voice & Vision Assistant</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
        video { width: 100%; max-width: 400px; background: #222; border-radius: 8px; margin: 20px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; border-radius: 4px; border: none; background: #007bff; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Realtime Voice & Vision Assistant</h1>
    <div>
        <video id="videoPreview" autoplay playsinline muted></video>
    </div>
    <div>
        <button id="startBtn">Start Assistant</button>
        <button id="stopBtn" disabled>Stop Assistant</button>
    </div>
    <div id="status">Disconnected</div>

    <script>
        const videoPreview = document.getElementById('videoPreview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');

        let ws = null;
        let stream = null;
        let audioContext = null;
        let scriptNode = null;
        let captureInterval = null;
        let audioQueue = [];
        let isPlaying = false;
        let nextPlayTime = 0;

        async function initMedia() {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            videoPreview.srcObject = stream;
        }

        function playNextAudio() {
            if (audioQueue.length === 0 || isPlaying) return;
            isPlaying = true;
            
            const base64Data = audioQueue.shift();
            
            // convert base64 to array buffer
            const binaryString = window.atob(base64Data);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            // output is raw PCM 16-bit 24kHz mono
            const audioData = new Int16Array(bytes.buffer);
            const buffer = audioContext.createBuffer(1, audioData.length, 24000);
            const channelData = buffer.getChannelData(0);
            
            for (let i = 0; i < audioData.length; i++) {
                channelData[i] = audioData[i] / 32768.0;
            }
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            
            source.onended = () => {
                isPlaying = false;
                playNextAudio();
            };
            
            // Ensure gapless playback if possible
            if (nextPlayTime < audioContext.currentTime) {
                nextPlayTime = audioContext.currentTime;
            }
            source.start(nextPlayTime);
            nextPlayTime += buffer.duration;
        }

        async function startAssistant() {
            if (!stream) await initMedia();
            
            // Init audio context for output
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            nextPlayTime = audioContext.currentTime;
            
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
            
            ws.onopen = () => {
                statusDiv.innerText = "Connected";
                startBtn.disabled = true;
                stopBtn.disabled = false;
                
                // Start sending audio
                const source = audioContext.createMediaStreamSource(stream);
                // Downsample to 16kHz for Gemini
                scriptNode = audioContext.createScriptProcessor(4096, 1, 1);
                
                source.connect(scriptNode);
                scriptNode.connect(audioContext.destination);
                
                scriptNode.onaudioprocess = (e) => {
                    if (ws.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        // Convert float32 to int16
                        const pcmData = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 32767;
                        }
                        
                        // NOTE: ScriptProcessorNode runs at audioContext.sampleRate (often 44.1k or 48k).
                        // In a real production app, you should resample to 16000Hz properly.
                        // Gemini will resample, but it's best to send exactly 16000Hz.
                        
                        const base64Data = btoa(String.fromCharCode(...new Uint8Array(pcmData.buffer)));
                        
                        ws.send(JSON.stringify({
                            realtimeInput: {
                                audio: {
                                    mimeType: `audio/pcm;rate=${audioContext.sampleRate}`, 
                                    data: base64Data
                                }
                            }
                        }));
                    }
                };

                // Start sending video frames (1 fps)
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                captureInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN && videoPreview.videoWidth > 0) {
                        // resize canvas for performance
                        canvas.width = 640;
                        canvas.height = 480;
                        ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                        const base64Data = dataUrl.split(',')[1];
                        
                        ws.send(JSON.stringify({
                            realtimeInput: {
                                video: {
                                    mimeType: "image/jpeg",
                                    data: base64Data
                                }
                            }
                        }));
                    }
                }, 1000); // 1 frame per second
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "audio") {
                    audioQueue.push(msg.data);
                    playNextAudio();
                } else if (msg.type === "interrupted") {
                    audioQueue = [];
                    isPlaying = false;
                    nextPlayTime = audioContext.currentTime;
                    console.log("Interrupted by Gemini");
                }
            };
            
            ws.onclose = () => {
                stopAssistant();
                statusDiv.innerText = "Disconnected";
            };
        }

        function stopAssistant() {
            if (ws) {
                ws.close();
                ws = null;
            }
            if (scriptNode) {
                scriptNode.disconnect();
                scriptNode = null;
            }
            if (captureInterval) {
                clearInterval(captureInterval);
                captureInterval = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.innerText = "Disconnected";
            audioQueue = [];
            isPlaying = false;
        }

        startBtn.addEventListener('click', startAssistant);
        stopBtn.addEventListener('click', stopAssistant);
    </script>
</body>
</html>
